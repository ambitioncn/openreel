server {
    listen 4173 ssl;
    listen [::]:4173 ssl;
    server_name openreel.io www.openreel.io;

    ssl_certificate /etc/letsencrypt/live/openreel.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openreel.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 110m;
    location = /metrics { return 404; }
    location = /health/ready { return 404; }

    location / {
        proxy_pass http://127.0.0.1:4273;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
